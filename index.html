<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffd100">
  <meta name="description" content="合租管家 - AA账单、家务排班与公共采购管理">
  <link rel="icon" type="image/png" href="assets/hezuguanjia-logo.png">
  <link rel="apple-touch-icon" href="assets/hezuguanjia-logo.png">
  <link rel="stylesheet" href="styles.css">
  <title>合租管家</title>
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <section id="login-screen" class="login-screen">
    <div class="login-brand">
      <img src="assets/hezuguanjia-logo.png" alt="合租管家" class="login-logo">
      <div>
        <p class="brand-kicker">一起住，也一起把生活理顺</p>
        <h1>合租管家</h1>
        <p>账算清，家管好，合租更轻松</p>
      </div>
    </div>

    <div class="login-panel">
      <div class="login-heading">
        <span class="eyebrow">欢迎回来</span>
        <h2>登录你的合租房</h2>
      </div>
      <form id="login-form" novalidate>
        <label class="field-label" for="phone">手机号</label>
        <div class="field-row">
          <span class="field-prefix">+86</span>
          <input id="phone" name="phone" inputmode="numeric" autocomplete="tel" maxlength="13" value="188 0000 0926" aria-describedby="phone-error">
        </div>
        <p id="phone-error" class="field-error"></p>

        <label class="field-label" for="room-code">房间邀请码</label>
        <input id="room-code" name="roomCode" autocomplete="one-time-code" maxlength="12" value="A-1902" aria-describedby="code-error">
        <p id="code-error" class="field-error"></p>

        <button class="primary-button login-button" type="submit">进入我的合租房 <span aria-hidden="true">→</span></button>
        <button class="text-button demo-login" id="demo-login" type="button">使用体验账号</button>
      </form>
      <p class="privacy-note">演示版不会发送短信，数据仅保存在当前浏览器。</p>
    </div>

    <div class="login-benefits" aria-label="核心功能">
      <div><b>AA</b><span>智能结算</span></div>
      <div><b>7天</b><span>家务轮班</span></div>
      <div><b>共享</b><span>采购清单</span></div>
    </div>
  </section>

  <div id="app-shell" class="app-shell is-hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="assets/hezuguanjia-logo.png" alt="">
        <div><strong>合租管家</strong><span>阳光花园 A-1902</span></div>
      </div>
      <nav id="desktop-nav" class="side-nav" aria-label="主导航"></nav>
      <div class="sidebar-room">
        <span>本月合租健康度</span>
        <strong>92</strong>
        <div class="progress-track"><i style="width:92%"></i></div>
        <small>账单及时，家务完成率良好</small>
      </div>
    </aside>

    <div class="app-main">
      <header class="top-header">
        <button class="room-switch" type="button" data-action="room-info">
          <span class="room-pin" aria-hidden="true">⌂</span>
          <span><b>阳光花园</b><small>A-1902 · 4位室友</small></span>
          <span aria-hidden="true">⌄</span>
        </button>
        <div class="header-actions">
          <button class="icon-button" type="button" data-action="messages" aria-label="消息"><span aria-hidden="true">♢</span><i id="message-dot"></i></button>
          <button class="avatar-button" type="button" data-tab="profile" aria-label="我的">象</button>
        </div>
      </header>

      <main id="page-content" class="page-content"></main>

      <nav id="mobile-nav" class="bottom-nav" aria-label="主导航"></nav>
    </div>
  </div>

  <div id="modal-backdrop" class="modal-backdrop is-hidden" aria-hidden="true">
    <section id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></section>
  </div>

  <template id="modal-shell-template">
    <header class="modal-header">
      <div><span class="eyebrow" id="modal-kicker"></span><h2 id="modal-title"></h2></div>
      <button class="icon-button modal-close" type="button" data-action="close-modal" aria-label="关闭">×</button>
    </header>
    <div id="modal-body" class="modal-body"></div>
  </template>

  <script src="app.js"></script>
</body>
</html>
