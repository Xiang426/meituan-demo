<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFD100">
  <link rel="icon" type="image/png" href="assets/hezuguanjia-logo.png">
  <link rel="apple-touch-icon" href="assets/hezuguanjia-logo.png">
  <title>合租管家</title>
  <style>
    :root {
      --yellow: #ffd100;
      --ink: #202124;
      --muted: #6b7280;
      --surface: #ffffff;
      --background: #f6f7f8;
      --teal: #08b89d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: var(--background);
      color: var(--ink);
    }

    .topbar {
      height: 10px;
      background: var(--yellow);
    }

    .container {
      width: min(900px, calc(100% - 40px));
      margin: 0 auto;
      padding: 84px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 44px;
    }

    .brand-logo {
      width: 112px;
      height: 112px;
      flex: 0 0 112px;
      object-fit: contain;
    }

    .brand-name {
      margin: 0;
      font-size: 48px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .brand-slogan {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.6;
    }

    .panel {
      padding: 30px;
      border: 1px solid #ececec;
      border-radius: 8px;
      background: var(--surface);
    }

    .panel p {
      margin: 0 0 12px;
      color: #4b5563;
      font-size: 18px;
      line-height: 1.8;
    }

    .panel p:last-of-type {
      margin-bottom: 0;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 26px;
      padding: 10px 16px;
      border-radius: 6px;
      background: var(--ink);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
    }

    .tag::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--teal);
      content: "";
    }

    @media (max-width: 560px) {
      .container {
        width: min(100% - 32px, 900px);
        padding: 52px 0;
      }

      .brand {
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 30px;
      }

      .brand-logo {
        width: 76px;
        height: 76px;
        flex-basis: 76px;
      }

      .brand-name {
        font-size: 34px;
      }

      .brand-slogan,
      .panel p {
        font-size: 16px;
      }

      .panel {
        padding: 22px;
      }
    }
  </style>
</head>

<body>
  <div class="topbar"></div>
  <main class="container">
    <header class="brand">
      <img
        class="brand-logo"
        src="assets/hezuguanjia-logo.png"
        alt="合租管家 Logo"
        width="112"
        height="112"
      >
      <div>
        <h1 class="brand-name">合租管家</h1>
        <p class="brand-slogan">账算清，家管好，合租更轻松</p>
      </div>
    </header>

    <section class="panel">
      <p>合租生活管理产品正在持续开发与迭代中。</p>
      <p>当前版本：V0.1<br>更新时间：2026年9月</p>
      <div class="tag">Project in Progress</div>
    </section>
  </main>
</body>
</html>
